name: themeandpagination
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^5.1.0
  get_it: ^8.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  internet_connection_checker: ^3.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.5.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - .env
    - assets/fonts/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: ZalandoSansSemiExpanded
      fonts:
        - asset: assets/fonts/ZalandoSansSemiExpanded-Regular.ttf
        - asset: assets/fonts/ZalandoSansSemiExpanded-Italic.ttf
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-Light.ttf
          weight: 300
        - asset: assets/fonts/ZalandoSansSemiExpanded-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZalandoSansSemiExpanded-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ZalandoSansSemiExpanded-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZalandoSansSemiExpanded-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/ZalandoSansSemiExpanded-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/ZalandoSansSemiExpanded-Black.ttf
          weight: 900
        - asset: assets/fonts/ZalandoSansSemiExpanded-BlackItalic.ttf
          weight: 900
          style: italic
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
